    <script>
    (function(){
      var btn=document.getElementById('theme-toggle');
      if(!btn)return;
      var root=document.documentElement;
      function sync(){
        var yongle=root.getAttribute('data-theme')==='yongle';
        btn.textContent=yongle?'庭燎':'永乐';
        btn.setAttribute('aria-label',yongle?'切换到庭燎主题':'切换到永乐主题');
      }
      sync();
      btn.addEventListener('click',function(){
        var yongle=root.getAttribute('data-theme')==='yongle';
        if(yongle){root.removeAttribute('data-theme');}
        else{root.setAttribute('data-theme','yongle');}
        try{localStorage.setItem('theme',yongle?'default':'yongle');}catch(e){}
        sync();
      });
    })();
    </script>
